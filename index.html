
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reserva tu Hotel — Tómalo Tours</title>

  <style>

    /* ── RESET MÍNIMO ── */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ── PÁGINA COMPLETA ── */

    body {
      min-height: 100vh;
      min-height: 100svh;

      background-image: url("fondo.jpeg");

      /*
        La imagen mantiene su proporción
        y cubre toda la pantalla.
      */
      background-size: cover;

      background-position: center center;

      background-repeat: no-repeat;

      background-color: #1A3A6B;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      cursor: pointer;
    }


    /* ── OVERLAY SEMITRANSPARENTE ── */

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      z-index: 0;

      pointer-events: none;
    }


    /* ── ENLACE INVISIBLE DEL FONDO ── */

    .fondo-link {
      position: fixed;

      inset: 0;

      z-index: 1;

      display: block;

      text-decoration: none;

      cursor: pointer;
    }


    /* ── CONTENEDOR DEL BOTÓN ── */

    main {
      position: relative;

      z-index: 2;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      /*
        BOTÓN ORIGINAL.
        No se modifica.
      */
      transform: translate(190px, 235px);
    }


    /* ── BOTÓN DE RESERVA ── */

    .btn-reserva {
      position: relative;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      min-width: 390px;

      min-height: 62px;

      padding: 16px 38px;

      font-family: "Segoe UI", Arial, sans-serif;

      font-size: 21px;

      font-weight: 800;

      letter-spacing: 0.02em;

      color: #FFFFFF;

      text-decoration: none;

      text-transform: uppercase;

      text-align: center;

      background: linear-gradient(
        135deg,
        #F02B2B 0%,
        #D71920 55%,
        #C1121F 100%
      );

      border: 2px solid rgba(255, 255, 255, 0.85);

      border-radius: 14px;

      cursor: pointer;

      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.45),
        0 0 0 3px rgba(214, 40, 40, 0.25);

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;

      overflow: hidden;

      isolation: isolate;
    }


    /* ── BRILLO SUTIL ── */

    .btn-reserva::after {
      content: "";

      position: absolute;

      top: 0;

      left: -100%;

      width: 55%;

      height: 100%;

      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 30%,
        rgba(255, 255, 255, 0.75) 50%,
        rgba(255, 255, 255, 0.08) 70%,
        transparent 100%
      );

      transform: skewX(-20deg);

      transition: left 0.65s ease;

      z-index: 1;

      pointer-events: none;
    }


    /* ── ANIMACIÓN DEL BRILLO ── */

    .btn-reserva:hover::after {
      left: 135%;
    }


    /* ── HOVER ── */

    .btn-reserva:hover {
      background: linear-gradient(
        135deg,
        #FF3838 0%,
        #E51C25 55%,
        #C91520 100%
      );

      transform: translateY(-3px) scale(1.03);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.50),
        0 0 0 4px rgba(214, 40, 40, 0.30);
    }


    /* ── CLICK ── */

    .btn-reserva:active {
      transform: translateY(0) scale(0.99);

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.35);
    }


    /* ── TEXTO ── */

    .btn-reserva .texto {
      position: relative;

      z-index: 2;
    }


    /* ── FLECHA ── */

    .btn-reserva .flecha {
      position: relative;

      z-index: 2;

      font-size: 22px;

      line-height: 1;

      transition: transform 0.18s ease;
    }


    /* ── ANIMACIÓN DE LA FLECHA ── */

    .btn-reserva:hover .flecha {
      transform: translateX(5px);
    }


    /* ── FOCO ── */

    .btn-reserva:focus-visible {
      outline: 3px solid #FFFFFF;

      outline-offset: 4px;
    }


    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 768px) {

      /*
        El fondo sigue llenando la pantalla,
        pero se centra correctamente.
      */

      body {
        background-size: cover;
        background-position: center center;
      }

      .btn-reserva {
        min-width: 300px;

        min-height: 58px;

        font-size: 18px;

        padding: 16px 30px;
      }

      main {
        transform: translate(0, 180px);
      }
    }


    /* =====================================================
       MÓVIL
       ===================================================== */

    @media (max-width: 480px) {

      /*
        En móviles usamos cover para evitar
        deformar la imagen.
      */

      body {
        background-size: cover;

        /*
          Puedes cambiar center por:
          center top
          center bottom
          40% center
          etc.
        */
        background-position: center center;
      }

      .btn-reserva {
        width: calc(100vw - 48px);

        min-width: 0;

        max-width: 360px;

        min-height: 56px;

        padding: 15px 24px;

        font-size: 17px;
      }

      main {
        transform: translate(0, 150px);
      }
    }


    /* =====================================================
       CELULARES MUY ALTOS / ESTRECHOS
       ===================================================== */

    @media (max-width: 480px) and (min-height: 700px) {

      body {
        /*
          Ajusta la posición vertical
          para que la parte importante
          de la imagen quede visible.
        */
        background-position: center center;
      }
    }


    /* =====================================================
       MÓVIL HORIZONTAL
       ===================================================== */

    @media (max-width: 900px) and (orientation: landscape) {

      body {
        background-size: cover;

        background-position: center center;
      }
    }


    /* =====================================================
       PANTALLAS GRANDES
       ===================================================== */

    @media (min-width: 1200px) {

      body {
        background-size: cover;

        background-position: center center;
      }
    }


    /* =====================================================
       REDUCIR ANIMACIONES
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .btn-reserva,
      .btn-reserva::after,
      .btn-reserva .flecha {
        transition: none;
      }
    }

  </style>
</head>


<body>


  <!--
    Enlace invisible que cubre todo el fondo.
    Cualquier clic fuera del botón lleva
    a la página de reserva.
  -->

  <a
    class="fondo-link"
    href="https://reserva.tomalotours.com"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Ir a la página de reservas"
  ></a>


  <!-- BOTÓN PRINCIPAL -->

  <main>

    <a
      class="btn-reserva"
      href="https://reserva.tomalotours.com"
      target="_blank"
      rel="noopener noreferrer"
    >

      <span class="texto">
        RESERVA AQUÍ AHORA
      </span>

      <span class="flecha">
        ➜
      </span>

    </a>

  </main>


</body>
</html>
```
