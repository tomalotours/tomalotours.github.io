```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reserva tu Hotel — Tómalo Tours</title>

  <style>
    /* ── RESET ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── PÁGINA COMPLETA ── */
    body {
      min-height: 100vh;
      min-height: 100svh;

      background-image: url("fondo.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #1A3A6B;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      cursor: pointer;
    }

    /* ── OSCURECER FONDO ── */
    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      z-index: 0;

      pointer-events: none;
    }

    /* ── ENLACE DEL FONDO ── */
    .fondo-link {
      position: fixed;
      inset: 0;

      z-index: 1;

      display: block;

      text-decoration: none;

      cursor: pointer;
    }

    /* ── CONTENEDOR ── */
    main {
      position: relative;
      z-index: 2;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      /*
        Posición adaptable:
        En pantallas grandes el botón
        queda desplazado hacia la derecha
        y hacia abajo.
      */
      transform: translate(
        clamp(0px, 12vw, 190px),
        clamp(100px, 15vh, 235px)
      );

      padding: 24px;
    }

    /* ── BOTÓN ── */
    .btn-reserva {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      width: min(390px, 90vw);

      min-height: 62px;

      padding: 16px 38px;

      font-family: "Segoe UI", Arial, sans-serif;
      font-size: clamp(17px, 1.4vw, 21px);
      font-weight: 800;

      letter-spacing: 0.02em;

      color: #FFFFFF;

      text-decoration: none;
      text-transform: uppercase;
      text-align: center;

      background: linear-gradient(
        135deg,
        #F02B2B 0%,
        #D71920 55%,
        #C1121F 100%
      );

      border: 2px solid rgba(255, 255, 255, 0.85);

      border-radius: 14px;

      cursor: pointer;

      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.45),
        0 0 0 3px rgba(214, 40, 40, 0.25);

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;

      overflow: hidden;

      isolation: isolate;
    }

    /* ── BRILLO ── */
    .btn-reserva::after {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 55%;
      height: 100%;

      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 30%,
        rgba(255, 255, 255, 0.75) 50%,
        rgba(255, 255, 255, 0.08) 70%,
        transparent 100%
      );

      transform: skewX(-20deg);

      transition: left 0.65s ease;

      z-index: 1;

      pointer-events: none;
    }

    /* ── ANIMACIÓN BRILLO ── */
    .btn-reserva:hover::after {
      left: 135%;
    }

    /* ── HOVER ── */
    .btn-reserva:hover {
      background: linear-gradient(
        135deg,
        #FF3838 0%,
        #E51C25 55%,
        #C91520 100%
      );

      transform: translateY(-3px) scale(1.03);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.50),
        0 0 0 4px rgba(214, 40, 40, 0.30);
    }

    /* ── CLICK ── */
    .btn-reserva:active {
      transform: translateY(0) scale(0.99);

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.35);
    }

    /* ── TEXTO ── */
    .btn-reserva .texto {
      position: relative;
      z-index: 2;
    }

    /* ── FLECHA ── */
    .btn-reserva .flecha {
      position: relative;
      z-index: 2;

      font-size: clamp(19px, 1.5vw, 22px);

      line-height: 1;

      transition: transform 0.18s ease;
    }

    /* ── ANIMACIÓN FLECHA ── */
    .btn-reserva:hover .flecha {
      transform: translateX(5px);
    }

    /* ── FOCO ── */
    .btn-reserva:focus-visible {
      outline: 3px solid #FFFFFF;
      outline-offset: 4px;
    }


    /* =====================================================
       TABLETS
       ===================================================== */

    @media (max-width: 900px) {

      main {
        transform: translate(
          0,
          clamp(100px, 16vh, 180px)
        );
      }

      .btn-reserva {
        width: min(360px, 80vw);
      }
    }


    /* =====================================================
       MÓVILES
       ===================================================== */

    @media (max-width: 600px) {

      body {
        background-position: center center;
      }

      main {
        transform: translate(
          0,
          clamp(80px, 15vh, 140px)
        );

        padding: 16px;
      }

      .btn-reserva {
        width: min(360px, 88vw);

        min-height: 56px;

        padding: 14px 22px;

        font-size: clamp(15px, 4.5vw, 18px);

        gap: 9px;

        border-radius: 12px;
      }

      .btn-reserva .flecha {
        font-size: 19px;
      }
    }


    /* =====================================================
       MÓVILES PEQUEÑOS
       ===================================================== */

    @media (max-width: 400px) {

      main {
        transform: translate(
          0,
          clamp(70px, 13vh, 110px)
        );
      }

      .btn-reserva {
        width: 90vw;

        min-height: 54px;

        padding: 13px 18px;

        font-size: 15px;

        gap: 7px;
      }

      .btn-reserva .flecha {
        font-size: 18px;
      }
    }


    /* =====================================================
       PANTALLAS MUY ALTAS
       ===================================================== */

    @media (min-height: 900px) and (min-width: 901px) {

      main {
        transform: translate(
          clamp(0px, 12vw, 190px),
          clamp(150px, 22vh, 250px)
        );
      }
    }


    /* =====================================================
       PANTALLAS MUY ANCHAS
       ===================================================== */

    @media (min-width: 1400px) {

      main {
        transform: translate(
          clamp(120px, 13vw, 220px),
          clamp(180px, 22vh, 280px)
        );
      }
    }


    /* =====================================================
       REDUCIR ANIMACIONES
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .btn-reserva,
      .btn-reserva::after,
      .btn-reserva .flecha {
        transition: none;
      }
    }

  </style>
</head>


<body>

  <!--
    Enlace invisible que cubre todo el fondo.
    Cualquier clic fuera del botón lleva
    a la página de reserva.
  -->

  <a
    class="fondo-link"
    href="https://reserva.tomalotours.com"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Ir a la página de reservas"
  ></a>


  <!-- BOTÓN PRINCIPAL -->

  <main>

    <a
      class="btn-reserva"
      href="https://reserva.tomalotours.com"
      target="_blank"
      rel="noopener noreferrer"
    >

      <span class="texto">
        RESERVA AQUÍ AHORA
      </span>

      <span class="flecha">
        ➜
      </span>

    </a>

  </main>

</body>
</html>
